# Build gate for NoteGuard. Xcode Cloud (configured in App Store Connect) separately archives
# pushes to main and uploads them to TestFlight; this workflow keeps main buildable.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs are cancelled mid-flight; on main a run finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: build/DerivedData
      RESULTS: build/Results
    steps:
      - uses: actions/checkout@v4

      # Held to Xcode 26: warnings are errors, so a new major's diagnostics shouldn't turn
      # main red unasked.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - run: xcodebuild -version

      # Pinned in .xcodegen-version (`make project` checks it too): another XcodeGen version
      # can write a different project and fail the drift check. Cached per version, so most runs
      # don't download it at all.
      - name: Cache XcodeGen
        uses: actions/cache@v4
        with:
          path: ~/xcodegen
          key: xcodegen-${{ runner.os }}-${{ hashFiles('.xcodegen-version') }}

      # GitHub's release downloads sometimes fail for a while (HTTP 5xx). Retry, and if the
      # download still fails, build the same tagged version from source (cloning keeps working
      # when release downloads don't). Either way it ends up in the same layout.
      - name: Install XcodeGen
        run: |
          XCODEGEN_VERSION=$(cat .xcodegen-version)
          if [ ! -x "$HOME/xcodegen/bin/xcodegen" ]; then
            rm -rf "$HOME/xcodegen"
            if curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                 -o "$RUNNER_TEMP/xcodegen.zip" \
                 "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"; then
              unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
              mv "$RUNNER_TEMP/xcodegen" "$HOME/xcodegen"
            else
              echo "::warning::XcodeGen download failed; building ${XCODEGEN_VERSION} from source."
              git clone -q --depth 1 --branch "$XCODEGEN_VERSION" \
                https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/xcodegen-src"
              # `cd`, not `make -C`: its Makefile finds SettingPresets via $(PWD).
              (cd "$RUNNER_TEMP/xcodegen-src" && make install PREFIX="$HOME/xcodegen" \
                SWIFT_BUILD_FLAGS="--disable-sandbox -c release")
            fi
          fi
          echo "$HOME/xcodegen/bin" >> "$GITHUB_PATH"
          "$HOME/xcodegen/bin/xcodegen" --version

      # The project is generated but committed (Xcode Cloud builds from a plain clone).
      - name: Committed project matches project.yml
        run: |
          xcodegen generate
          # `status`, not `diff`: a file XcodeGen adds inside the bundle is untracked.
          if [ -n "$(git status --porcelain -- NoteGuard.xcodeproj NoteGuard/Info.plist)" ]; then
            git status --short -- NoteGuard.xcodeproj NoteGuard/Info.plist
            echo "::error::NoteGuard.xcodeproj is stale — run 'make project' and commit it."
            exit 1
          fi

      # NoteGuard is iPad-only, so tests need an iPad simulator.
      - name: Pick an iPad simulator
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPad")))')
          echo "Using $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"

      # Unsigned, warnings as errors: the app plus the unit tests.
      - name: Build Debug for testing
        run: |
          xcodebuild build-for-testing -project NoteGuard.xcodeproj -scheme NoteGuard \
            -destination "id=$SIM" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/build-debug.xcresult"

      - name: Unit tests
        run: |
          xcodebuild test-without-building -project NoteGuard.xcodeproj -scheme NoteGuard \
            -destination "id=$SIM" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/unit-tests.xcresult"

      # Release too, so code that only compiles in Debug is caught before archive day.
      - name: Build Release
        run: |
          xcodebuild build -project NoteGuard.xcodeproj -scheme NoteGuard \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            -derivedDataPath "$DERIVED_DATA" -resultBundlePath "$RESULTS/build-release.xcresult"

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/Results
          if-no-files-found: ignore
