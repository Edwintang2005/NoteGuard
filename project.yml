# XcodeGen spec — the source of truth for NoteGuard.app.
# Regenerate the Xcode project with:  make project     (or: xcodegen generate)
# The generated NoteGuard.xcodeproj is committed (Xcode Cloud builds from a plain clone), so
# commit it alongside any change here. Never change settings in Xcode's UI: they're overwritten.
name: NoteGuard
options:
  bundleIdPrefix: com.NoteGuard
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # dSYMs for every archive, so TestFlight crash reports come back symbolicated.
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  # Unit tests (Swift Testing), hosted in the app so UIKit, PDFKit and PencilKit behave as on device.
  NoteGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/NoteGuardTests]
    dependencies:
      - target: NoteGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NoteGuard.app.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3L8Q3U3WY3
  NoteGuard:
    type: application
    platform: iOS
    sources: [NoteGuard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.NoteGuard.app
        # iPad only. Must stay at target level: XcodeGen's target presets write "1,2", which
        # would beat a project-level value.
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        # Must live here, not just in Xcode's Signing tab, or `make project` wipes it.
        DEVELOPMENT_TEAM: 3L8Q3U3WY3
        # Xcode Cloud stamps its own build number on the archives it uploads; this value is
        # what local/manual archives use. Keep it monotonic.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: NoteGuard/Info.plist
      properties:
        CFBundleDisplayName: NoteGuard
        # Only Apple's standard HTTPS/file encryption is used, so no export-compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  # Shared scheme: Xcode Cloud and CI both build it. Archive uses Release.
  NoteGuard:
    build:
      targets:
        NoteGuard: all
        NoteGuardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NoteGuardTests
    archive:
      config: Release
